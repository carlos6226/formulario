<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de formulário</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-7">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                            <h1 class="text-center mt-5">Formulário de Contato</h1>
                            <p class="text-muted text-center mb-4">
                                Preencha os campos abaixo
                            </p>
                                <form>
                                    <div class="mb-3">
                                        <label for="nome" class="form-label">Nome completo </label>
                                        <input type="text" id="nome" class="form-control"
                                        placeholder="Digite o nome do cliente">
                                    </div>

                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label for="E-mail" >Email</label>
                                            <input type="email" id="email" class="form-control" 
                                            placeholder="cliente@email.com">
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label for="telefone">Telefone</label>
                                            <input type="text" id="telefone" class="form-control" 
                                            placeholder="(43) 9 9999-9999">
                                        </div>
                                    </div>
                                    <div class="d-flex justify-content-end gap-2">
                                        <button type="reset" class="btn btn-outline-secondary">Cancelar</button>
                                        <button type="submit" class="btn btn-success">Salvar</button>
                                    </div>
                                </form>
                        </div>                    
                    </div>
                </div>
            </div>
    </div>
</body>
</html>

<!-- bg-light classe para deixar o fundo claro,
 container para centralizar o conteúdo, 
 row e col-md-8 para criar uma coluna de 8 unidades em telas médias,
 card para criar um cartão com sombra, card-body para o conteúdo do cartão,
form-label para os rótulos dos campos,
 form-control para os campos de entrada, d-flex justify-content-end para
 alinhar os botões à direita e gap-2 para adicionar um espaço entre eles. -->
